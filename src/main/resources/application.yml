server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:creditiq}?serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  quiz:
    coins-per-question: ${COINS_PER_QUESTION:50}
  cricket:
    coins-per-run: ${COINS_PER_RUN:10}
    max-balls: ${CRICKET_MAX_BALLS:6}
  leaderboard:
    size: ${LEADERBOARD_SIZE:10}
  otp:
    fixed-code: ${OTP_FIXED_CODE:1234}
    ttl-minutes: ${OTP_TTL_MIN:5}
  integrations:
    cibil:
      mode: ${CIBIL_MODE:mock}
      base-url: ${CIBIL_BASE_URL:}
      timeout-ms: ${CIBIL_TIMEOUT_MS:3000}
    experian:
      mode: ${EXPERIAN_MODE:mock}
      base-url: ${EXPERIAN_BASE_URL:}
    crm:
      mode: ${CRM_MODE:log}
      base-url: ${CRM_BASE_URL:}
